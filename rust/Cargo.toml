[workspace]
resolver = "2"
# PHASE-7
# zap-script embeds Boa (boa_engine 0.21, no JVM) for script types `proxy`
# and `httpsender`. Hook names match ZAP core: proxyRequest, proxyResponse,
# sendingRequest, responseReceived.
# AlertOnHttpResponseCodeErrors.js does not run: it calls Nashorn/Graal
# `Java.type` for java.lang.Integer, java.util.regex.Pattern,
# org.parosproxy.paros.core.scanner.Alert, ExtensionAlert, and
# HistoryReference, and it reads the `control` and `model` globals.
# PHASE-5: zap-auth is context include/exclude regexes, form and JSON
# authentication, and cookie session management. Send-as-user is
# UpstreamClient::send_as_user in zap-http. This phase does not include
# the active scanner.
members = [
    "zap-core",
    "zap-http",
    "zap-proxy",
    "zap-store",
    "zap-api",
    "zap-pscan",
    "zap-script",
    "zap-auth",
    # PHASE-6: active scan engine and the two ascanrules ports.
    "zap-ascan",
    # PHASE-8: add-on manifest, registry, and the sample add-on.
    # The sample rule is not named by zapd. Java .zap files are not loaded.
    "zap-addon",
    "zap-addon-sample",
    # Scan rules from pscanrules v70 and ascanrules v78. zapd loads the
    # bundled manifests and does not name the rules. 10021, 40003, and
    # 90021 stay in zap-pscan and zap-ascan.
    "zap-scanrules",
    # PHASE-9: traditional spider (spider 0.18.0). AJAX spider is not included.
    "zap-spider",
    # AJAX spider without a browser runtime. HTML links and inline script
    # string literals. Chrome, Firefox, and WebDriver are not started.
    "zap-ajax",
    # PHASE-10: optional desktop (sites, history, request/response, alerts, break).
    # zapd does not depend on this crate, so the daemon still runs without the UI.
    "zap-desktop",
    # OpenAPI 2 and 3 import. A local JSON or YAML file becomes spider seeds.
    # The definition is not downloaded.
    "zap-openapi",
    # Automation plans: requestor, spider, passiveScan-wait, activeScan, report.
    # No JDK. No browser. Release, Docker Hub, Sonar, and Crowdin are not included.
    "zap-automation",
    "zapd",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
rust-version = "1.88"

[workspace.dependencies]
boa_engine = "=0.21.1"
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1.5", features = ["http1", "client", "server"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"] }
hyper-util = { version = "0.1.10", features = ["tokio", "client-legacy", "http1"] }
rcgen = { version = "=0.14.7", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
semver = "1"
serde_json = "1"
thiserror = "1"
tokio = { version = "1.42", features = ["macros", "net", "rt-multi-thread", "io-util", "sync", "time", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webpki-roots = "0.26"
zap-api = { path = "zap-api" }
# PHASE-8: add-on manifest, registry, and the sample add-on.
zap-addon = { path = "zap-addon" }
zap-addon-sample = { path = "zap-addon-sample" }
# PHASE-9: traditional spider (spider 0.18.0). AJAX spider is not included.
zap-spider = { path = "zap-spider" }
# AJAX spider without a browser runtime.
zap-ajax = { path = "zap-ajax" }
# OpenAPI 2 and 3 import from a local JSON or YAML file.
# Definitions are not downloaded.
zap-openapi = { path = "zap-openapi" }
# PHASE-11: docker/Dockerfile-zapd runs zapd. No JDK. Baseline counts cover
# the passive rules ported so far (plugin 10021). The automation framework
# and the AJAX spider are not in the image.
# META-ENGINE: zapd flags and http://zap/ actions drive the traditional
# spider seed, Boa proxy and httpsender script files, and a context file
# with form or JSON login plus send-as-user. No new scan rules. No AJAX spider.
# PHASE-6: active scan engine and the two ascanrules ports.
zap-ascan = { path = "zap-ascan" }
# YAML automation plans. No JDK. No browser.
zap-automation = { path = "zap-automation" }
zap-auth = { path = "zap-auth" }
zap-core = { path = "zap-core" }
# PHASE-10: optional desktop UI. zapd does not depend on this crate.
zap-desktop = { path = "zap-desktop" }
zap-http = { path = "zap-http" }
zap-proxy = { path = "zap-proxy" }
zap-pscan = { path = "zap-pscan" }
zap-script = { path = "zap-script" }
zap-scanrules = { path = "zap-scanrules" }
zap-store = { path = "zap-store" }
