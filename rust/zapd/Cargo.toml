[package]
name = "zapd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Daemon for the zapd intercepting proxy. Not an official OWASP ZAP build."

[[bin]]
name = "zapd"
path = "src/main.rs"

[dependencies]
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zap-api.workspace = true
# PHASE-8: add-on registry. The sample crate is linked so its factory is
# available. zapd does not name the sample rule.
zap-addon.workspace = true
zap-addon-sample.workspace = true
# PHASE-9: traditional spider. AJAX spider is not included.
zap-spider.workspace = true
# PHASE-6: active scan engine and the two ascanrules ports.
zap-ascan.workspace = true
zap-auth.workspace = true
zap-core.workspace = true
zap-proxy.workspace = true
zap-pscan.workspace = true
zap-script.workspace = true
zap-store.workspace = true

[dev-dependencies]
# PHASE-6: types used by the ascan wiring test.
bytes.workspace = true
http.workspace = true
serde_json.workspace = true
